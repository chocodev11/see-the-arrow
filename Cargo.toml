[package]
name = "see-the-arrow"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Show the human where to click: a big arrow with a sign above every window, on Windows and Linux. Click-through, never takes the focus, gone by itself."
license = "MIT"
repository = "https://github.com/chocodev11/see-the-arrow"
readme = "README.md"
keywords = ["agent", "overlay", "accessibility", "cli", "pointer"]
categories = ["command-line-utilities", "accessibility"]
exclude = [".github/", ".vscode/", "docs/"]

# The command stays `bigarrow`, command-line compatible with bigarrow for macOS.
[[bin]]
name = "bigarrow"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
parley = "0.12"
skrifa = "0.44"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr", "xinput", "resource_manager", "image"] }
arboard = { version = "3.6", default-features = false }
atspi = "0.30"
zbus = "5"
rustix = { version = "1", features = ["process", "event", "fs", "pipe"] }
signal-hook = "0.4"
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
